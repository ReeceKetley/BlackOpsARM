plugins {
    id "com.android.application"
}

// An explicit reviewed native staging directory lets development APKs reuse the
// same production build used on the tablet. Normal builds use the source recipe.
def nativeStage = providers.gradleProperty("bo1NativePrebuiltDir").orNull
// Diagnostic resources are opt-in and never enter ordinary performance APKs.
def asanWrapDir = providers.gradleProperty("bo1NativeAsanWrapDir").orNull
if (asanWrapDir != null) {
    if (nativeStage == null || !file("${asanWrapDir}/lib/arm64-v8a/wrap.sh").isFile()) {
        throw new GradleException("ASan wrapping requires an explicit staged native build and real wrap.sh")
    }
    ["clang_rt.asan-aarch64-android", "c++_shared"].each { name ->
        if (!file("${nativeStage}/arm64-v8a/lib${name}.so").isFile()) {
            throw new GradleException("Missing ASan runtime provider: ${name}")
        }
    }
}
if (nativeStage != null && file("${nativeStage}/arm64-v8a/libclang_rt.asan-aarch64-android.so").isFile() && asanWrapDir == null) {
    throw new GradleException("ASan native staging requires explicit -Pbo1NativeAsanWrapDir")
}
def nativeLibraries = ["blackopsarm_engine", "blackopsarm_environment", "SDL2", "dxvk_d3d9", "steam_api",
                       "bo1_native_shader_compiler", "clang_rt.ubsan_standalone-aarch64-android"]
if (nativeStage != null) {
    nativeLibraries.each { name ->
        if (!file("${nativeStage}/arm64-v8a/lib${name}.so").isFile()) {
            throw new GradleException("Missing actual native library: ${name}")
        }
    }
}

android {
    namespace "com.blackopsarm.dev"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "com.blackopsarm.dev"
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName "0.2.0-dev"
        ndk {
            abiFilters "arm64-v8a"
        }
        if (nativeStage == null) {
            externalNativeBuild {
                cmake {
                    targets "blackopsarm_engine", "blackopsarm_environment"
                    arguments "-DANDROID_PLATFORM=android-28"
                    cppFlags "-O0 -g"
                }
            }
        }
    }

    if (nativeStage == null) {
        externalNativeBuild {
            cmake {
                path file("../../src/platform/android/CMakeLists.txt")
                version "3.22.1"
            }
        }
    }

    sourceSets {
        debug {
            if (asanWrapDir != null) resources.srcDir(asanWrapDir)
        }
        main {
            java.srcDirs += ["../../../DXVK-Native/third_party/SDL/android-project/app/src/main/java"]
            if (nativeStage != null) jniLibs.srcDirs = [nativeStage]
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            // Keep matching debug/UBSan symbols in this development package.
            keepDebugSymbols += ["**/*.so"]
        }
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
