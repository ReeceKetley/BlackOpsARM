plugins {
    id "com.android.application"
}

android {
    namespace "com.blackopsarm.dev"
    compileSdk 35
    buildToolsVersion "35.0.0"
    ndkVersion "30.0.16248370"

    defaultConfig {
        applicationId "com.blackopsarm.dev"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "0.1-dev"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        cmake {
            path file("../../src/platform/android/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
